[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "haverbot"
version = "0.1.0"
description = "Modular Hebrew Telegram bot with daily Israeli horoscopes"
requires-python = ">=3.15.1,<3.16"
dependencies = [
  "python-telegram-bot>=22.8,<23",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.14,<5",
  "aiosqlite>=0.21,<1",
  "pyluach>=2.2,<3",
  "python-dotenv>=1.1,<2",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "pytest-cov>=7", "ruff>=0.14", "ty>=0.0.1"]

[project.scripts]
haverbot = "haverbot.main:main"
haverbot-check-providers = "haverbot.check_providers:main"
haverbot-import-compliments = "haverbot.compliments.import_catalog:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
python-version = "3.15"
