name: CI/CD
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.13.5
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=haverbot --cov-report=term-missing
      - name: Check tracked files for accidental secrets
        run: uv run python scripts/check_public_files.py
  docker:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: haverbot:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Container imports, non-root user, and persistent SQLite volume
        run: |
          docker run --rm --entrypoint python haverbot:test -c 'import os, haverbot.main; from haverbot.compliments.catalog import bundled_catalog; assert os.getuid() == 10001; assert len(bundled_catalog()) == 505'
          docker volume create haverbot-ci-data
          docker run --rm -v haverbot-ci-data:/data --entrypoint python haverbot:test -c 'import asyncio; from haverbot.storage import Store; from haverbot.domain import GroupSettings; exec("async def check():\n s=Store(\"/data/check.db\"); await s.open(); await s.save_settings(GroupSettings(-1)); await s.close()"); asyncio.run(check())'
          docker run --rm -v haverbot-ci-data:/data --entrypoint python haverbot:test -c 'import asyncio; from haverbot.storage import Store; exec("async def check():\n s=Store(\"/data/check.db\"); await s.open(); assert len(await s.groups())==1; await s.close()"); asyncio.run(check())'
          docker volume rm haverbot-ci-data

  publish:
    name: Publish to GHCR
    needs: [checks, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish AMD64 and ARM64
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
